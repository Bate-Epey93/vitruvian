<div class="app">

  <!-- TOPBAR — translucent header: brand left, nav island centre, tools right.
       While reading, the island compacts to icons and the audience switch and
       reader tools take the spare room. -->
  <header class="topbar">
    <div class="tb-left">
      <button class="tbtn icon-only" id="backBtn" aria-label="Back to library" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 15l-5-5 5-5"/></svg></button>

        <div class="brand-text">
          <div class="brand-name" id="brandName">Vitruvian</div>
          <div class="brand-sub" id="brandSub">The anatomy of everyday systems</div>
        </div>
      </div>
    </div>
    <nav class="tb-nav" id="tbNav" aria-label="Main">
      <button class="nav-btn" id="libraryBtn" data-screen="library"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.5"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1.5"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1.5"/><rect x="11" y="11" width="5.5" height="5.5" rx="1.5"/></svg><span class="tbtn-label">Home</span></button>
      <button class="nav-btn" id="trackBtn" data-screen="track" aria-label="Your path and your progress"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="15" r="1.8"/><circle cx="15" cy="5" r="1.8"/><path d="M6.8 15h4.7a2.6 2.6 0 0 0 0-5.2h-3a2.6 2.6 0 0 1 0-5.2h4.7"/></svg><span class="tbtn-label">Path</span></button>
      <button class="nav-btn" id="modelsBtn" data-screen="models" aria-label="Thinking models"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8l7.2 7.2-7.2 7.2L2.8 10z"/><path d="M10 7l3 3-3 3-3-3z"/></svg><span class="tbtn-label">Models</span></button>
      <button class="nav-btn" id="drillBtn" data-screen="drill" aria-label="Review"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.6v3.2h-3.2"/></svg><span class="tbtn-label">Review</span></button>
    </nav>
    <div class="aud-switch" id="audSwitch" hidden></div>
    <div class="tb-right">
      <button class="tbtn ctx-btn" id="sheetBtn" aria-label="System sheet: who wants what, rules, pieces, flows and limits" title="System sheet: the reference card for this system" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2.8" width="12" height="14.4" rx="2"/><path d="M7 7h6M7 10h6M7 13h3.5"/></svg><span class="tbtn-label">System sheet</span></button>
      <button class="tbtn ctx-btn" id="seqBtn" aria-label="Sequence view, interaction order" title="Sequence view: interaction order" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3v14M15 3v14"/><path d="M5 7.5h9M12 5.8l2 1.7-2 1.7"/><path d="M15 12.5H6M8 10.8l-2 1.7 2 1.7"/></svg><span class="tbtn-label">Sequence</span></button>

      <button class="tbtn icon-only" id="settingsBtn" data-screen="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6.5h7M14.5 6.5h2M3.5 13.5h2M9.5 13.5h7"/><circle cx="12.5" cy="6.5" r="2"/><circle cx="7.5" cy="13.5" r="2"/></svg></button>

        <button class="tbtn icon-only" id="readerMenuBtn" aria-label="Deconstruct menu" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.3" class="ico-fill"/><circle cx="10" cy="10" r="1.3" class="ico-fill"/><circle cx="15.5" cy="10" r="1.3" class="ico-fill"/></svg></button>
        <div class="menu-pop" id="menuPop" hidden></div>
      </div>
    </div>
